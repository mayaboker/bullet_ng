# One reusable tmux session for the manual hover/land mission.
session_name: bullet-hover-land
# The launch script exports this absolute path before loading the config.
start_directory: ${BULLET_DRONE_ROOT}
windows:
  - window_name: hover-land
    # Keep Scene, App, and View in three equally sized terminal panes.
    layout: even-horizontal
    panes:
      - shell_command:
          - __NV_PRIME_RENDER_OFFLOAD=1 __GLX_VENDOR_LIBRARY_NAME=nvidia uv run --frozen --extra render --extra sitl --extra mavlink launcher --sitl --render --render-monitor DP-1-0 --render-half top
      - shell_command:
          - bash tools/run_app_after_sitl.sh hover-land
      - shell_command:
          - uv run --project ../bullet_view --locked bullet-view --image-endpoint tcp://127.0.0.1:5556 --monitor DP-1-0 --monitor-half bottom
