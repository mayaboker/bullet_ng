# SITL connections for the hover/land tmux stack.
betaflight:
  # MSP carries commands and board identity.
  msp:
    # Use the SITL TCP listener.
    type: tcp
    # Local MSP listener address.
    host: 127.0.0.1
    # Local MSP listener port.
    port: 5761
  # MAVLink carries vehicle telemetry.
  mavlink:
    # Use the SITL TCP listener.
    type: tcp
    # Local MAVLink endpoint.
    endpoint: tcp:127.0.0.1:5762
# Hover/land does not consume simulator contact events.
simulation:
  # Disable the target-hit contact subscriber.
  enabled: false
# Publish blackboard snapshots to the MCAP bagger without blocking mission steps.
telemetry_publisher:
  # Must match the bagger's telemetry channel endpoint.
  endpoint: tcp://127.0.0.1:5558
  # Per-topic publication rates in frames per second; 0 disables a topic.
  topics:
    telemetry/heartbeat: 1
    telemetry/attitude: 20
    telemetry/vfr_hud: 10
    telemetry/gps_raw_int: 2  # Record GPS_RAW_INT at 2 samples/s; 0 disables it.
    telemetry/global_position_int: 2  # Record GLOBAL_POSITION_INT at 2 samples/s; 0 disables it.
    telemetry/timesync: 1
    visual/bbox: 0
    simulation/target_contact: 0
    features/navigation_input: 0
    features/navigation_result: 0
    view/alive: 1
